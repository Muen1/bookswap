name: bookswap
description: A marketplace for students to exchange textbooks

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Firebase Core
  firebase_core: ^4.12.1
  
  # Authentication
  firebase_auth: ^6.5.6
  
  # Database
  cloud_firestore: ^6.7.1
  
  # Storage
  firebase_storage: ^13.4.5
  
  # State Management
  flutter_riverpod: ^3.3.2
  
  # Image Handling - COMPATIBLE VERSIONS
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  
  # UI
  google_fonts: ^6.1.0
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/